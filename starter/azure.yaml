# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.9"
name: copilot-finops-agent
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: "2026-03-17"
        sku:
          name: GlobalStandard
          capacity: 10
  finops-agent:
    host: azure.ai.agent
    project: .
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: copilot-finops-agent
    displayName: Copilot FinOps Agent
    description: Analyze GitHub Copilot AI-credit cost and usage using workshop data.
    protocols:
      - protocol: responses
        version: 2.0.0
      - protocol: invocations
        version: 2.0.0
    env:
      FINOPS_MODEL_PROVIDER: foundry-identity
      MODEL_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      FINOPS_BACKEND: mock
      FINOPS_DATA_DIR: data
      FINOPS_OTEL_EXPORTER: azure-monitor
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
infra:
  provider: microsoft.foundry
